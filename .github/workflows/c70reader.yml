name: Build C70Reader x86

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'C70Reader/**'
      - 'CMakeLists.txt'
      - '.github/workflows/c70reader.yml'

jobs:
  build-c70reader-x86:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Conan and detect profile
        run: |
          pip install conan
          conan profile detect --force

      - name: Install dependencies
        run: >-
          conan install . --build=missing --profile=default -s arch=x86 -s compiler.cppstd=20

      - name: Configure CMake
        run: cmake --preset conan-default -A Win32

      - name: Build C70Reader
        run: |
          cd build
          cmake --build . --config Release --target C70Reader --parallel 4

      - name: Run offline protocol self-test
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter C70Reader.exe | Where-Object { $_.FullName -match '\\Release\\' } | Select-Object -First 1
          if (-not $exe) { throw 'C70Reader.exe not found' }
          & $exe.FullName --selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload C70Reader artifact
        uses: actions/upload-artifact@v4
        with:
          name: C70Reader_x86
          path: build/**/Release/C70Reader.exe
          if-no-files-found: error
